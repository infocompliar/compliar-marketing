<svg xmlns="http://www.w3.org/2000/svg" width="1063" height="732" viewBox="0 0 900 620">
  <rect width="900" height="620" fill="#ffffff"/>
  <rect x="18" y="18" width="864" height="584" fill="none" stroke="#000000" stroke-width="14"/>
  <!-- Hazard Triangle -->
  <path d="M185 115 L295 315 L75 315 Z" fill="#ffd200" stroke="#000000" stroke-width="18" stroke-linejoin="round"/>
  <rect x="176" y="178" width="18" height="74" rx="4" fill="#000000"/>
  <circle cx="185" cy="278" r="11" fill="#000000"/>
  <!-- Notice Text -->
  <text x="565" y="170" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#000000">False alarm notice</text>
  <text x="565" y="232" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#000000">This fire alarm system has an</text>
  <text x="565" y="274" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#000000">active connection to the fire</text>
  <text x="565" y="316" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#000000">and rescue service</text>
  <!-- Divider -->
